[workspace]

[package]
name = "ibex2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
# LLP 0059.000 §3.4: a partial URL parser is a security bug rather than a
# missing feature, so URL is a well-tested crate and not hand-written.
base64 = "0.22"
getrandom = "0.2"
form_urlencoded = "1.2"
sha2 = "0.10"
ring = { version = "0.17", optional = true }
url = "2.5"
serde_json = "1"
# The one normal dependency: it owns native link lines and the selected ICU
# tier, and its `links` metadata gives this crate's build script headers,
# hermesc and the bytecode version. There is deliberately no build-dependency
# on it, so no second instance can select or report an ICU tier (R-e).
hermes-lean-sys = { path = "../hermes-lean-sys", optional = true, default-features = false }

[dev-dependencies]
ibex2-sqlite = { path = "../ibex2-sqlite" }
# Exercise the portable transport on Apple too, without linking it in Apple builds.
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
libc = "0.2"
ureq = { package = "exact-ureq", path = "../../../ureq", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

# HTTP/1.1 and WebSockets off Apple use rustls. Android delegates certificate
# verification to its trust manager; other hosts read native roots and fall back
# to webpki roots only when none are usable.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
libc = "0.2"
ureq = { package = "exact-ureq", path = "../../../ureq", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
# The compiled-in roots for a socket's own TLS where the machine has none
# (the copy ureq already links).
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
ureq = { package = "exact-ureq", path = "../../../ureq", default-features = false, features = ["rustls", "platform-verifier"] }
# android/ implements the 0.7 JNI interface (CertificateVerifierTest checks it).
rustls-platform-verifier = "0.7.1"
jni = { version = "0.22.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
mio = { version = "1", features = ["os-poll", "net"], optional = true }
socket2 = { version = "0.6", optional = true }
ureq = { package = "exact-ureq", path = "../../../ureq", default-features = false, features = ["rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.7", optional = true }
webpki-roots = { version = "1", optional = true }

[features]
default = ["crypto", "websocket"]
bindings = ["dep:hermes-lean-sys"]
# Linux's JSI Intl shims exceed LLP 0057.000 D5's default-on budget. The
# ordinary Intl door selects the English ICU tier; callers that need every ICU
# locale select the separate all-locales door. hermes-lean-sys alone owns link
# lines and the selected data.
intl = ["bindings", "hermes-lean-sys/icu-en-data"]
intl-all-locales = ["intl", "hermes-lean-sys/icu-full-data"]
# Symmetric WebCrypto algorithms backed by the workspace's unmodified,
# vendored ring. Randomness remains available without this feature.
crypto = ["dep:ring"]
# ECDSA P-256, Ed25519, and their SPKI/PKCS#8 codecs exceed LLP 0057.000
# D6's default-on size budget, so consumers opt in explicitly.
crypto-asymmetric = ["crypto"]
# Application WebSockets. The grant grammar and the refusing Rust/JS surface
# remain present when this is off; only the transport implementation is cut.
websocket = []
test-support = ["portable-http"]
# Explicit production alternative; the native Apple transport remains default.
portable-http = [
    "dep:mio",
    "dep:socket2",
    "dep:ureq",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]
