[workspace]

[package]
name = "ibex2-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ibex2 = { path = "../ibex2", default-features = false }
# The minimum Apple OS's SQLite is older than rusqlite's bindings.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "limits", "extra_check"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "limits", "extra_check"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
