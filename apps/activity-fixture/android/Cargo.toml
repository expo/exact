# The Live Activity fixture on Android's Canvas host (LLP 1126 D13): one library with
# the runner, the kernel, the data crate, the baked plan (written by build.rs,
# never committed) and the host's JNI, which the reader (host/android) loads as
# libexactcanvas.so. Off Android the library is empty: the Canvas host is
# Android's (`exact_painted::canvas`).
[package]
name = "activity-fixture-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Live Activity fixture on Android's Canvas host: the library the reader loads"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
activity-fixture-data = { path = "../data" }
exact-painted = { path = "../../../host/painted" }

[build-dependencies]
activity-fixture-data = { path = "../data" }
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
