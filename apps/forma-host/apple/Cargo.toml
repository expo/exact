[package]
name = "forma-host-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Forma binding host on Apple platforms: a native module drawing with the design"
publish = false
build = "build.rs"

[lib]
name = "forma_host_apple"
crate-type = ["rlib"]
test = false
bench = false

[dependencies]
ibex2-sqlite = { path = "../../../vendor/ibex/crates/ibex2-sqlite" }
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
forma-host-data = { path = "../data" }

[build-dependencies]
contract = { path = "../../../contract/cli" }
exact-bake = { path = "../../../bake" }
forma-host-data = { path = "../data" }
