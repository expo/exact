# Heavy list on Android's Canvas host: the library the reader (host/android)
# loads as libexactcanvas.so. Empty off Android.
[package]
name = "exact-heavylist-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
exact-heavylist-data = { path = "../data" }
exact-painted = { path = "../../../../host/painted" }

[build-dependencies]
exact-heavylist-data = { path = "../data" }
contract = { path = "../../../../contract/cli" }
exact-bake = { path = "../../../../bake" }
