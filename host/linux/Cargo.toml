# The Linux host: the painted host in a Wayland window, on DRM/KMS with
# evdev input, over VNC, or headless. Wayland libraries load at runtime.
#
# @ref LLP 1015 (this host)
[package]
name = "exact-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux host: the painted host in a Wayland window, on DRM/KMS, over VNC, or headless"
publish = false

[lib]
name = "exact_linux"
crate-type = ["rlib"]

[features]
# Attached agent sessions (LLP 1012.000 D2), off by default: no build selects it
# until a Linux display has the person's controls for it (piece 8).
attach = ["dep:libc", "dep:serde_json"]

[dependencies]
exact-painted = { path = "../painted" }
exact-runner = { path = "../../runner" }
tiny-skia = "0.12"
libc = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06", "async-io"] }
libc = "0.2"
des = "0.8"
getrandom = "0.3"
drm = "0.15"
evdev = "0.13"
serde_json = "1"
rustix = { version = "1.1", features = ["thread"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[dev-dependencies]
exact-logic = { path = "../../logic" }
exact-plan = { path = "../../plan" }
sha2 = "0.10"
serde_json = "1"
libc = "0.2"
contract = { path = "../../contract/cli" }
exact-kernel = { path = "../../kernel" }
des = "0.8"
getrandom = "0.3"

[target.'cfg(unix)'.dev-dependencies]
# The KMS flip state and the VNC password tests run without a display on macOS too.
drm = "0.15"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
