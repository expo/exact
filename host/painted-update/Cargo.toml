# The update store a painted host composes (LLP 1030 D4; LLP 1030.006 D3):
# an optional delivery adapter above exact-painted, linked by the Linux
# host's update entry and by an Android library whose bake says "A".
[package]
name = "exact-painted-update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
exact-painted = { path = "../painted" }
exact-runner = { path = "../../runner" }
exact-update = { path = "../../update" }
ibex2 = { path = "../../vendor/ibex/crates/ibex2", default-features = false }

[dev-dependencies]
caltrain = { path = "../../apps/caltrain" }
caltrain-data = { path = "../../apps/caltrain/data" }
exact-kernel = { path = "../../kernel" }
serde_json = "1.0"
