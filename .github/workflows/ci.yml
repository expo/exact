# The only blocking command is scripts/gate.mjs; only failed parts fail CI.
# Cold compilation may exceed its 30 s warm budget. Full verification runs hourly.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A run on main is never stopped by a newer push. While one runs, the newest
# push waits and takes the place of any push that was waiting before it, so
# pushes do not pile up. A pull request's newer push replaces the run of the
# one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # The Linux host's DRM/KMS, input and font dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libudev-dev libinput-dev libdrm-dev libgbm-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          # A failed check still leaves what it compiled for the next run.
          cache-on-failure: true

      - name: Hermes bundle
        # Ordinary builds are offline (.cargo/config.toml); the installer fetches and
        # verifies Ibex's pinned, attested release bundle once.
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target x86_64-unknown-linux-gnu

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: Cargo dependencies
        # caps inspects workspace metadata offline.
        id: deps
        run: cargo fetch --locked

      - name: gate
        run: bun scripts/gate.mjs

  macos:
    # A Blacksmith runner, as in expo/expo: GitHub's hosted macOS runners are
    # shared by every repository in the org.
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Hermes bundle
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target aarch64-apple-darwin

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: Cargo dependencies
        run: cargo fetch --locked

      - name: gate
        run: bun scripts/gate.mjs
