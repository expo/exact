# Builds the docs site (docs/site) after a push to main that changes docs/ and publishes it to Cloudflare Pages,
# project exact-docs. For a pull request with the `docs-preview` label it only builds, and
# docs-preview-publish.yml publishes that build.
#
# The build job runs the code of the branch it builds, so it holds no secret. The deploy job holds the
# Cloudflare token and runs none of what the build made: it uploads the build's files with main's wrangler.
name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, reopened, labeled, synchronize, edited]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # A run started by hand builds main and no other branch. A pull request from a fork gets no preview. A label
    # other than `docs-preview` starts no build, and of a pull request's edits only a change of its base does:
    # docs-preview-publish.yml publishes for a pull request into main alone.
    if: >-
      github.repository == 'expo/exact' && (
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-preview') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'labeled' || github.event.label.name == 'docs-preview') &&
          (github.event.action != 'edited' || github.event.changes.base.ref.from != null)))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A build of main is never stopped by a newer push, which waits for it, as ci.yml's run on main does. A pull
    # request's newer push replaces its build. A label or an edit that starts no build gets a group of its own,
    # so it stops none.
    concurrency:
      group: >-
        ${{ ((github.event.action == 'labeled' && github.event.label.name != 'docs-preview') ||
        (github.event.action == 'edited' && github.event.changes.base.ref.from == null))
        && format('docs-build-run-{0}', github.run_id) || format('docs-build-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tools/gen.ts dates each page from `git log`, which reads commits and trees but no file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Bun dependencies
        run: bun install --frozen-lockfile && bun install --frozen-lockfile --cwd docs/site

      - name: Web build tools
        run: bun scripts/exact.mjs setup --platform web

      - name: Build
        working-directory: docs/site
        run: bun run build:pages

      - name: Test
        working-directory: docs/site
        run: bun test --timeout 20000 ./tests/worker.test.ts ./tests/pages.test.ts ./tests/descriptions.test.ts

      # What a publish uploads. The installation files are under .exact/, a hidden directory.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs/site/dist.pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # Only the branch main is published as the site. A tag named main has another ref.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docs
    # A publish is never stopped by a newer one, which waits for it. GitHub does not promise the order of the
    # jobs in a group, and a run can be run again, so the first step refuses a commit that main has moved past.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # This commit is the newest to publish when it has main's last commit to each path that starts this
      # workflow. Otherwise a later run publishes, or has published, a newer site.
      - name: Check that main has no newer docs
        id: newest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            for (const path of ['docs', '.github/workflows/docs.yml']) {
              const { data: [last] } = await github.rest.repos.listCommits({ owner, repo, sha: main.commit.sha, path, per_page: 1 });
              if (!last || last.sha === context.sha) continue;
              const { data: { status } } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${last.sha}...${context.sha}`, per_page: 1 });
              if (status !== 'ahead' && status !== 'identical') return core.notice(`Not published: main has a newer commit to ${path}, ${last.sha}.`);
            }
            core.setOutput('publish', true);

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.newest.outputs.publish
        with:
          sparse-checkout: docs/site

      # no-cache: a cache is written by workflows that run other code.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.newest.outputs.publish
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install wrangler from the lockfile
        if: steps.newest.outputs.publish
        working-directory: docs/site
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.newest.outputs.publish
        with:
          name: docs-site
          path: docs/site/dist.pages

      # --no-bundle: tools/pages.ts has bundled the worker, and a bundler here would read files the build names.
      - name: Publish
        if: steps.newest.outputs.publish
        working-directory: docs/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bun x --no-install wrangler pages deploy dist.pages --project-name=exact-docs --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=true --no-bundle

      - name: Delete older deployments of the site
        if: steps.newest.outputs.publish
        working-directory: docs/site
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun tools/prune-cloudflare-deployments.mjs --project=exact-docs --branch=main --keep=2
