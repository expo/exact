# Builds the docs site (docs/site) after a push to main that changes docs/ and publishes it to Cloudflare Pages,
# project exact-docs.
#
# The build job runs the code of the branch it builds, so it holds no secret. The deploy job holds the
# Cloudflare token and runs none of what the build made: it uploads the build's files with main's wrangler.
name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # A run started by hand builds main and no other branch.
    if: github.repository == 'expo/exact' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A build of main is never stopped by a newer push, which waits for it, as ci.yml's run on main does.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tools/gen.ts dates each page from `git log`, which reads commits and trees but no file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Bun dependencies
        run: bun install --frozen-lockfile && bun install --frozen-lockfile --cwd docs/site

      - name: Web build tools
        run: bun scripts/exact.mjs setup --platform web

      - name: Build
        working-directory: docs/site
        run: bun run build:pages

      - name: Test
        working-directory: docs/site
        run: bun test --timeout 20000 ./tests/worker.test.ts ./tests/pages.test.ts

      # What a publish uploads. The installation files are under .exact/, a hidden directory.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs/site/dist.pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # Only the branch main is published as the site. A tag named main has another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docs
    # A publish is never stopped by a newer one, which waits for it.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: docs/site

      # no-cache: a cache is written by workflows that run other code.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install wrangler from the lockfile
        working-directory: docs/site
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: docs/site/dist.pages

      # --no-bundle: tools/pages.ts has bundled the worker, and a bundler here would read files the build names.
      - name: Publish
        working-directory: docs/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bun x --no-install wrangler pages deploy dist.pages --project-name=exact-docs --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=true --no-bundle

      - name: Delete older deployments of the site
        working-directory: docs/site
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun tools/prune-cloudflare-deployments.mjs --project=exact-docs --branch=main --keep=2
