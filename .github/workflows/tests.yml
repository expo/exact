# Hosted tests are hourly and do not block landing. scripts/async.mjs owns
# affected-suite selection and commit attribution on the provisioned fleet.
name: tests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Bound linking and compile concurrency on the 16 GB hosted runner:
      # compiling and linking two large integration test crates concurrently
      # exhausts runner memory and kills the job (OOM exit 137 / shutdown 143).
      # CARGO_BUILD_JOBS=1 runs one rustc/lld at a time while 4 codegen units
      # still use all 4 vCPUs during LLVM codegen.
      # The two CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_* variables apply only to
      # Linux host builds; CARGO_PROFILE_DEV_* and CARGO_BUILD_JOBS apply to
      # every Cargo build in this job.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "4"
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "clang"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--threads=1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Toolchains the image ships and this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          for v in ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          df -h /

      - name: System packages
        # The Linux host's DRM/KMS, input and font dependencies. Fetching the lists,
        # and then the packages, takes under 20 s each from a healthy mirror. The
        # runner's first mirror is dropped for the next when either takes 40 s.
        timeout-minutes: 5
        run: |
          packages=(
            pkg-config clang lld libudev-dev libinput-dev libdrm-dev libgbm-dev
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev
          )
          fetch() {
            local apt=(sudo timeout -k 5 "$1" apt-get -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5)
            "${apt[@]}" update &&
              "${apt[@]}" install -y --no-install-recommends --download-only "${packages[@]}"
          }
          if ! fetch 40; then
            echo "::warning::The runner's first Ubuntu mirror was slow or failed; using the next ones."
            sudo sed -i 1d /etc/apt/apt-mirrors.txt
            fetch 80
          fi
          sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          # A run with a failing test still leaves what it compiled for the next one.
          cache-on-failure: true

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: Hermes bundle
        # Ordinary builds are offline (.cargo/config.toml); the installer fetches and
        # verifies Ibex's pinned, attested release bundle once.
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target x86_64-unknown-linux-gnu

      - name: Cargo dependencies
        run: cargo fetch --locked

      - name: test
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --tests --no-fail-fast -- --test-threads=2

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "clang"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          for v in ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          df -h /

      - name: System packages
        timeout-minutes: 5
        run: |
          packages=(
            pkg-config clang lld libudev-dev libinput-dev libdrm-dev libgbm-dev
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev
          )
          fetch() {
            local apt=(sudo timeout -k 5 "$1" apt-get -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5)
            "${apt[@]}" update &&
              "${apt[@]}" install -y --no-install-recommends --download-only "${packages[@]}"
          }
          if ! fetch 40; then
            echo "::warning::The runner's first Ubuntu mirror was slow or failed; using the next ones."
            sudo sed -i 1d /etc/apt/apt-mirrors.txt
            fetch 80
          fi
          sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          key: scripts-shard-${{ matrix.shard }}
          cache-on-failure: true

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: Hermes bundle
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target x86_64-unknown-linux-gnu

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: SDK
        # What the script tests build with (README): the web nightly with
        # rust-src, wasm-bindgen and Binaryen. With CHROME set it downloads no
        # Playwright Chromium.
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: bun scripts/exact.mjs setup

      - name: script tests
        # Cargo writes no colour here: tests read its output.
        # package-libraries-link.test.mjs is excluded: it builds an external app
        # and native libraries from scratch and documents running by name only.
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(
            bun -e '
              import { readdirSync, statSync } from "node:fs";
              const shards = 8, shard = Number(process.env.SHARD);
              // Measured seconds on ubuntu-24.04 for the heavy Chrome/wasm suites, so
              // greedy bin-packing keeps every shard under ~20 min (never stacking
              // several slow suites into one shard and overrunning the hourly cron).
              const slow = {
                "forma-server.test.mjs": 1091, "design-tool-inspect.test.mjs": 530,
                "forma-inspect-pages.test.mjs": 472, "forma-select-walk.test.mjs": 409,
                "deploy.test.mjs": 389, "app-server.test.mjs": 369,
                "web-build-rust.test.mjs": 364, "forma-select-reveal.test.mjs": 357,
                "design-tool-noaxes.test.mjs": 345, "verify.test.mjs": 318,
                "design-tool-kinds.test.mjs": 250, "app-rust.test.mjs": 235,
                "design-tool-scrub.test.mjs": 196, "windows.test.mjs": 183,
                "dev-copies.test.mjs": 175, "agent-test.test.mjs": 164,
                "app-bake.test.mjs": 147, "smoke-inspect.test.mjs": 143,
                "app-path.test.mjs": 119, "links.test.mjs": 103,
                "agent-android.test.mjs": 98,
              };
              const weight = f => slow[f] ?? Math.max(1, statSync("scripts/" + f).size / 2048);
              const all = readdirSync("scripts")
                .filter(f => f.endsWith(".test.mjs") && f !== "package-libraries-link.test.mjs")
                .sort((a, b) => weight(b) - weight(a) || a.localeCompare(b));
              const loads = Array(shards).fill(0), buckets = Array.from({ length: shards }, () => []);
              for (const f of all) {
                let best = 0;
                for (let i = 1; i < shards; i++) if (loads[i] < loads[best]) best = i;
                buckets[best].push("./scripts/" + f);
                loads[best] += weight(f);
              }
              for (const f of buckets[shard]) console.log(f);
            '
          )
          cargo build -q -p contract --bin contract -p exact-web-js --bin exact-web-js
          if [[ " ${files[*]} " == *"./scripts/agent-test.test.mjs"* ]]; then
            cargo build --profile host-dev -p caltrain-linux --bin caltrain-render
          fi
          if [[ " ${files[*]} " == *"./scripts/forma-server.test.mjs"* ]]; then
            cargo build -q -p exact-gpu-reflect --bin exact-gpu-reflect -p caltrain-linux --bin caltrain-render
            cargo build -q --profile host-dev -p theme-fixture-web --bin theme-fixture-dev
          fi
          echo "Running ${#files[@]} script test files (shard $SHARD)"
          bun test "${files[@]}"
