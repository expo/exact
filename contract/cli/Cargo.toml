# The Contract compiler driver: the pipeline as one call, the CLI, and the
# build-time bake (one runner boot against the app's data source, so every
# resource's boot value ships inside the plan). @ref LLP 1004 D2/D4.
[package]
name = "contract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract compiler driver: parse → types → analyze → lower, plus the build-time bake and the CLI"
publish = false

[lib]
name = "contract"
crate-type = ["rlib"]

[[bin]]
name = "contract"
path = "src/main.rs"

[dependencies]
contract-analyze = { path = "../analyze" }
contract-checking = { path = "../checking" }
contract-lower = { path = "../lower" }
contract-syntax = { path = "../syntax" }
contract-types = { path = "../types" }
exact-kernel = { path = "../../kernel" }
# `contract forma`: the design's own check, eval and IR (LLP 1121 D2).
exact-forma = { path = "../../forma" }
exact-plan = { path = "../../plan" }
exact-runner = { path = "../../runner" }
# Literal package shaders use the same WGSL validator as GPU builds (LLP 1181 D9).
exact-gpu-reflect = { path = "../../gpu/reflect" }
exact-shader-uniforms = { path = "../../packages/shader/uniforms" }
exact-color = { path = "../../color" }
# The app manifest, diagnostics and source maps as JSON; plan digests.
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# `contract forma serve`: its journal and temporary files opened with
# O_NOFOLLOW.
libc = "0.2"

[dev-dependencies]
# A Rust source's crypto, baked (LLP 1069.005 D5).
exact-data = { path = "../../data" }
exact-motion = { path = "../../motion" }
