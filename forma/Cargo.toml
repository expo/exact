# Forma: the `.forma` grammar, its checker and the build's one evaluator.
# @ref LLP 1121 D2 — a leaf below the Contract compiler, the `forma` verbs
# and the design tool's wasm; a shipped build never carries it.
[package]
name = "exact-forma"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forma designs: parse, check and fold to the IR (LLP 1121)"
publish = false

[lib]
name = "exact_forma"
crate-type = ["rlib"]

[dependencies]
exact-color = { path = "../color" }
exact-num = { path = "../num" }
exact-plan = { path = "../plan" }
# A motion token is checked as its transition reads it (LLP 1121 stage 6 E).
exact-motion = { path = "../motion" }
# The DTCG importer reads JSON (LLP 1121 D14).
serde_json = "1.0"
# A `.pen` file's axes and variables in the order written (stage 13 B).
serde = "1.0"

[dev-dependencies]
exact-kernel = { path = "../kernel" }
# The scale tests time the thread's own CPU, which load elsewhere leaves be.
libc = "0.2"
